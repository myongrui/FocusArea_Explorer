<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Area Explorer</title>
  <meta name="description" content="Drag NUS CS focus areas onto a canvas to build a self-relayering AY2026-27 prerequisite tree and see where areas share modules.">
  <link rel="stylesheet" href="css/styles.css?v=20261163">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Focus Area Explorer</h1>
    </header>

    <div class="app">
      <aside class="palette" id="palette">
        <div class="pal-head">
          <h2>Focus Areas</h2>
          <button class="pal-add" id="btnAddCat" title="Create a category">+ Category</button>
        </div>
        <div id="palBody"></div>
        <div class="pal-actions">
          <button class="btn" id="btnAll">Add all</button>
          <button class="btn" id="btnClear">Clear</button>
        </div>
      </aside>

      <section class="stage" id="stage">
        <div class="stage-bar">
          <span class="stat"><b id="sN">13</b> modules</span>
          <span class="stat"><b id="sE">0</b> links</span>
          <span class="stat"><b id="sA">0</b> areas</span>
          <button class="fitbtn on" id="btnUnpin" hidden title="Clear all pinned modules"></button>
          <span class="spacer"></span>
          <label class="pathway-toggle" title="Hide alternative routes outside the CS foundation curriculum">
            <input type="checkbox" id="csOnly" checked>
            CS pathway only
          </label>
          <label class="pathway-toggle">
            <input type="checkbox" id="showAllLinks">
            Show all links
          </label>
          <span class="leg"><span class="box"></span>required</span>
          <span class="leg"><span class="box dash"></span>one of several</span>
          <button class="fitbtn" id="btnFit" title="Scale the whole tree to fit the pane">Fit</button>
        </div>
        <div class="scroll" id="scroll">
          <div class="canvas" id="canvas">
            <svg class="edges" id="edges"></svg>
            <div id="nodeLayer"></div>
          </div>
          <div class="empty" id="empty">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
            <span class="big">Drag a focus area here</span>
          </div>
        </div>
        <div class="drophint" id="drophint">Drop to add</div>
      </section>
    </div>

    <section class="planner" aria-label="Semester planner">
      <div class="planner-main">
      <div class="planner-settings">
        <form class="planner-search" id="planAddForm" role="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="planCode" type="search" aria-label="Search modules by code or name" aria-controls="planSearchResults" autocomplete="off" required>
          <ul class="plan-search-results" id="planSearchResults" aria-label="Module search results" hidden></ul>
        </form>
        <div class="planner-inline-actions">
          <button class="btn" id="addFoundations" title="Add all foundation modules">Add foundations</button>
          <button class="icon-btn" id="importPlanner" type="button" title="Import plan" aria-label="Import plan"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span>Import</span></button>
          <input type="file" id="planFile" accept=".json,application/json" hidden>
          <button class="icon-btn" id="exportPlanner" type="button" title="Export to NUSMods" aria-label="Export to NUSMods"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg><span>Export</span></button>
        </div>
      </div>
      <div class="plan-progress-block">
        <div class="plan-progress-row">
          <div class="plan-progress-holder">
            <span class="plan-progress-stop stop-cleared" id="planCleared">0</span>
            <span class="plan-progress-stop stop-planned" id="planPlanned">0</span>
            <span class="plan-progress-stop stop-total" id="planTarget">160</span>
            <div class="plan-progress" id="planProgress" role="progressbar" aria-label="Cleared and planned units" aria-valuemin="0" aria-valuemax="160" aria-valuenow="0">
              <i class="plan-progress-cleared" id="planBarCleared"></i><i class="plan-progress-planned" id="planBarPlanned"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="plan-pillars" id="planPillars" aria-label="Degree pillar progress"></div>
      <p class="planner-status" id="plannerStatus" role="status"></p>
      <div class="planner-timeline" tabindex="0" role="region" aria-label="Academic years — scroll horizontally to view later semesters">
        <div class="planner-semesters" id="plannerSemesters"></div>
      </div>
      <div class="planner-buckets" id="plannerBuckets"></div>
      </div>
    </section>
  </div>

  <script src="js/data.js?v=20261163"></script>
  <script src="js/app.js?v=20261163"></script>
  <script src="js/planner-core.js?v=20261163"></script>
  <script src="js/planner.js?v=20261163"></script>
</body>
</html>
